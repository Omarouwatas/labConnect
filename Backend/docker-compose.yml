


services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=projet_db
      - POSTGRES_USER=admin_projet
      - POSTGRES_PASSWORD=MotDePasse123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_projet -d projet_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


